# Publishes the tracker to GitHub Pages with fresh TCGplayer prices.
# Runs every day, whenever you change files on the main branch, and on demand
# (Actions tab -> "Deploy tracker with fresh prices" -> Run workflow).
name: Deploy tracker with fresh prices

on:
  schedule:
    - cron: "17 10 * * *"   # daily, 10:17 UTC (early morning US time)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site and download prices
        run: python scripts/build_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
